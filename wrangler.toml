name = "skycart"
main = "src/index.ts"
compatibility_date = "2026-10-29"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "skycart-db"
# The Cloudflare deploy script creates this database when missing and fills in its ID.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]
